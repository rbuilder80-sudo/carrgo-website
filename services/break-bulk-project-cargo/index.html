<h1>Break Bulk &amp; Project Cargo Shipping UK</h1>
<p>Carrgo moves cargo that does not fit in a standard container — oversized,
overweight, out-of-gauge and heavy-lift consignments loaded individually rather
than in a sealed box. <a href="https://www.carrgo.co.uk/get-a-quote/">Get a quote in 2 hours</a> or
<a href="https://www.carrgo.co.uk/contact/">contact the team</a>.</p>

<h2>What is break bulk cargo?</h2>
<p>Break bulk cargo is freight loaded onto a vessel as individual pieces — crated,
palletised, drummed, bagged or strapped — rather than inside a shipping container.
It is handled piece by piece with cranes or ship's gear. Break bulk is used when
cargo is too large, too heavy or too awkwardly shaped to containerise, or when the
destination port lacks container-handling equipment.</p>

<h2>Break bulk or bulk cargo — what is the difference?</h2>
<p>They sound similar and mean different things. <strong>Bulk cargo</strong> is
unpackaged loose commodity poured or pumped into a hold — grain, coal, ore, cement,
liquids. <strong>Break bulk</strong> is individually packaged units handled
separately: machinery, steel sections, crates, reels, vehicles. Bulk is measured by
tonnage of a single commodity; break bulk is counted in pieces.</p>

<h2>What counts as project cargo?</h2>
<p>Project cargo is the movement of large, high-value or complex consignments that
need engineering and planning rather than a standard booking — typically capital
equipment for construction, energy, manufacturing or infrastructure work. A project
cargo move often combines several modes, route surveys, lifting plans, permits and
escorts, and is scheduled around a site delivery date rather than a sailing.</p>
<h3>Typical project cargo we handle</h3>
<p>Industrial plant and production lines, generators and transformers, construction
and agricultural machinery, tanks and pressure vessels, structural steel, wind and
renewable-energy components, and relocation of complete factory equipment.</p>

<h2>When do you need break bulk instead of a container?</h2>
<p>Use break bulk or out-of-gauge handling when any dimension exceeds the internal
limits of a 40ft container — roughly 12 metres long, 2.3 metres wide and 2.3 metres
high — or when the piece weight exceeds what a container floor and standard lifting
can safely take. Cargo that is slightly over can sometimes travel on a flat rack or
open top, which is cheaper than full break bulk, so send dimensions and weights
before assuming which method applies. See
<a href="https://www.carrgo.co.uk/services/container-shipping/">container shipping</a> for standard
equipment options and the
<a href="https://www.carrgo.co.uk/resources/container-size-guide/">container size guide</a> for internal
dimensions.</p>

<h2>How is break bulk and project cargo priced?</h2>
<p>Unlike container freight there is no per-box rate. Pricing is built from the
cargo's actual dimensions and weight, the lifting equipment required at each end,
port handling and storage, any specialist inland transport, permits and escorts for
abnormal loads, marine insurance, and the customs entry. Because each move is
engineered individually, a firm price needs the real figures — length, width,
height, weight per piece, and the collection and delivery points.
<a href="https://www.carrgo.co.uk/get-a-quote/">Send those and we will quote</a>.</p>

<h2>What information should you send for a quote?</h2>
<ul>
  <li>Dimensions and weight of <strong>each</strong> piece, not just the total</li>
  <li>Number of pieces and how they are packed — crated, skidded, loose</li>
  <li>Collection address and final delivery site postcode</li>
  <li>Whether lifting equipment is available at either end</li>
  <li>Any fixed deadline, such as an installation or shutdown date</li>
  <li>The Incoterms your supplier quoted — see the
      <a href="https://www.carrgo.co.uk/resources/incoterms-guide/">Incoterms guide</a></li>
</ul>

<h2>Which UK ports handle break bulk and heavy lift?</h2>
<p>Not every port can take out-of-gauge or heavy-lift cargo — it depends on crane
capacity, quay strength and laydown space. Port choice also affects inland routing,
because an abnormal load needs a viable road route from the quay to the site. Carrgo
publishes live conditions for 17 UK and Ireland ports on the
<a href="https://www.carrgo.co.uk/resources/port-congestion-tracker/">port congestion tracker</a>, with
weekly movement data in the
<a href="https://www.carrgo.co.uk/resources/uk-port-congestion-report/">UK port congestion report</a>, and
you can compare two options with the
<a href="https://www.carrgo.co.uk/tools/port-comparison/">port comparison tool</a>.</p>

<h2>Does Carrgo handle customs on project shipments?</h2>
<p>Yes. Break bulk and project consignments need the same customs entry as any
import, and often additional documentation for temporary imports, returned goods or
equipment coming in for a fixed project period. Carrgo handles the declaration and
the duty and VAT position as part of the move — see
<a href="https://www.carrgo.co.uk/services/customs-clearance/">customs clearance</a>.</p>
