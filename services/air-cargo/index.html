<h2>What counts as air cargo?</h2>
<p>Air cargo is any goods carried by aircraft as freight rather than as passenger
baggage — from a single urgent pallet to a full charter. It travels either in the
belly hold of a scheduled passenger flight or on a dedicated freighter, and is
handled through cargo terminals with its own customs and security process.</p>

<h2>How much does air cargo cost to the UK?</h2>
<p>Air cargo is priced on chargeable weight, which is the greater of actual weight
and volumetric weight, plus fuel and security surcharges, handling at both ends,
customs entry, and duty and VAT. Because bulky-but-light shipments are charged on
their size, packaging efficiency has a direct effect on the bill. Price a shipment
with the <a href="https://www.carrgo.co.uk/tools/cost-calculator/">freight cost calculator</a>.</p>

<h2>What can and cannot fly?</h2>
<p>Most general cargo flies without issue. Restricted and dangerous goods —
lithium batteries, aerosols, flammable liquids, magnetised material — are subject
to IATA rules and need correct classification, packing and declaration. Undeclared
dangerous goods are the fastest way to have a shipment stopped, so declare them
properly and they can usually still move.</p>

<h2>How fast is air cargo really?</h2>
<p>The flight is the short part. Airport to airport is typically 1-3 days, but door
to door is realistically 4-8 days once collection, export clearance,
consolidation, UK customs and delivery are included. Delays are almost always
paperwork, not aircraft. Accurate commercial invoices and commodity codes are what
keep it fast.</p>

<h2>What air cargo services does Carrgo provide?</h2>
<p>Scheduled and express air cargo, consolidation, charter for outsize or urgent
loads, perishables and temperature-controlled handling, dangerous goods where
permitted, and full <a href="https://www.carrgo.co.uk/services/customs-clearance/">customs clearance</a>.
See also <a href="https://www.carrgo.co.uk/services/air-freight/">air freight services</a> or
<a href="https://www.carrgo.co.uk/get-a-quote/">request a quote</a>.</p>


<h2>Air cargo vs air freight — is there a difference?</h2>
<p>In practice they mean the same goods-by-air service. "Air cargo" tends to
describe the goods and the industry, while "air freight" describes the service
you buy, but a shipper asking for either is after the same outcome. Carrgo
handles both general and specialist consignments — see
<a href="https://www.carrgo.co.uk/services/air-freight/">air freight services</a>.</p>
