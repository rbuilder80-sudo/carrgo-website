<p><strong>Services:</strong> <a href="https://www.carrgo.co.uk/services/sea-freight">Sea Freight</a> | <a href="https://www.carrgo.co.uk/services/air-freight">Air Freight</a> | <a href="https://www.carrgo.co.uk/services/road-freight">Road Freight</a> | <a href="https://www.carrgo.co.uk/services/customs-clearance">Customs Clearance</a> | <a href="https://www.carrgo.co.uk/resources/port-congestion-tracker">Port Tracker</a></p>

<h2>What container sizes are available and what fits in them?</h2>
<p>The two standard dry containers are the 20ft and the 40ft. A 20ft offers around
33 cubic metres capacity with roughly 28 usable once loaded on pallets; a 40ft
offers around 67 with roughly 58 usable. A 40ft High Cube adds about a foot of
internal height for light, bulky cargo. Specialist equipment covers the rest:
reefers for temperature control, open tops for over-height cargo, and flat racks
for out-of-gauge loads. Full detail is in the
<a href="https://www.carrgo.co.uk/resources/container-size-guide/">container size guide</a>.</p>

<h2>How many pallets fit in a container?</h2>
<p>As a working rule, a 20ft takes 10-11 standard UK pallets in a single layer and
a 40ft takes 20-21, before any double stacking. Actual figures depend on pallet
footprint, load height and weight limits, so confirm against your own packing list
rather than assuming the maximum.</p>

<h2>What do container shipping companies charge for?</h2>
<p>Ocean freight is only part of the bill. Expect the base sea freight rate, bunker
and currency adjustment surcharges, origin terminal handling, UK terminal handling,
customs entry, plus duty and VAT. Demurrage and detention start once free time at
the port expires, which is where unplanned costs usually appear. Estimate your
total with the <a href="https://www.carrgo.co.uk/tools/cost-calculator/">cost calculator</a>.</p>

<h2>How do you avoid demurrage and detention charges?</h2>
<p>Have the customs entry and funds ready before the vessel arrives, not after, and
route through a port that is actually clearing cargo. Free time is short and the
daily charges escalate. Check current conditions on the
<a href="https://www.carrgo.co.uk/resources/port-congestion-tracker/">port congestion tracker</a> before
fixing the routing, and read the weekly
<a href="https://www.carrgo.co.uk/resources/uk-port-congestion-report/">port congestion report</a> for
which ports are trending worse.</p>

<h2>What container shipping does Carrgo handle?</h2>
<p>FCL and LCL into all major UK ports, reefer and specialist equipment, break bulk
and project cargo, customs clearance, and onward delivery. See
<a href="https://www.carrgo.co.uk/services/sea-freight/">sea freight</a> for the wider service or
<a href="https://www.carrgo.co.uk/get-a-quote/">request a quote</a>.</p>


<h2>How do you choose container shipping companies?</h2>
<p>Ask whether they handle your lane and container type regularly, quote the
all-in landed cost rather than the sea freight leg alone, and can tell you which
UK port is currently clearing fastest. Carrgo publishes live
<a href="https://www.carrgo.co.uk/resources/port-congestion-tracker/">port congestion scores</a> so
its routing advice is based on real data, not habit.</p>

<h2>What is container freight?</h2>
<p>Container freight is cargo moved in a standard shipping container — FCL if it
fills one, LCL if it shares one. It is the default way goods travel by sea, and
the pricing follows container size, the lane, surcharges, port handling and duty
plus VAT on arrival. <a href="https://www.carrgo.co.uk/services/container-shipping/">Container
shipping</a> with Carrgo covers FCL, LCL and specialist equipment.</p>
