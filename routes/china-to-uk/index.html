<h1>Shipping from China to UK — Sea, Air &amp; Rail Freight</h1>
<p>Importing from China? Carrgo handles China to UK shipping with sea freight (25-35 days), air freight (3-7 days), and rail (14-22 days). Full customs clearance included. Avoid delays and hidden costs — get your China import quote today.</p>
<p><strong>Carrgo Freight Solutions</strong> — UK freight forwarder handling sea freight, air cargo, road haulage, rail freight, and customs clearance for UK importers and exporters.</p>
<p><a href="https://www.carrgo.co.uk/get-a-quote">Get a free quote in 2 hours</a> | <a href="https://www.carrgo.co.uk/contact">Contact us</a></p>
<p><strong>Who we help:</strong> UK importers, exporters, procurement managers, logistics managers, manufacturers, ecommerce businesses, Amazon FBA sellers, wholesalers, retailers, and customs-clearance customers.</p>
<p><strong>Services:</strong> <a href="https://www.carrgo.co.uk/services/sea-freight">Sea Freight</a> | <a href="https://www.carrgo.co.uk/services/air-freight">Air Freight</a> | <a href="https://www.carrgo.co.uk/services/road-freight">Road Freight</a> | <a href="https://www.carrgo.co.uk/services/customs-clearance">Customs Clearance</a> | <a href="https://www.carrgo.co.uk/resources/port-congestion-tracker">Port Tracker</a></p>

<h2>How long does shipping from China to the UK take?</h2>
<p>Transit depends on the mode. Sea freight from major Chinese ports (Shanghai,
Ningbo, Shenzhen, Qingdao) to the UK typically takes <strong>25-35 days</strong>
port to port. Air freight takes <strong>3-7 days</strong> airport to airport. Rail
freight along the New Silk Road takes <strong>14-22 days</strong>. Express courier
for consignments under 100&nbsp;kg takes <strong>2-5 days</strong>. Add a few days
for UK customs clearance and final delivery unless you choose a door-to-door
service that includes them.</p>
<table>
<tr><th>Mode</th><th>Typical transit</th><th>Best for</th><th>Cost position</th></tr>
<tr><td>Sea (FCL / LCL)</td><td>25-35 days</td><td>Heavy, bulky, non-urgent volume</td><td>Lowest per unit</td></tr>
<tr><td>Rail</td><td>14-22 days</td><td>Mid-urgency, cost-sensitive goods</td><td>Mid-point</td></tr>
<tr><td>Air</td><td>3-7 days</td><td>Urgent, high-value, small shipments</td><td>Highest per unit</td></tr>
<tr><td>Express courier</td><td>2-5 days</td><td>Under 100&nbsp;kg, samples and spares</td><td>Highest per kg</td></tr>
</table>

<h2>Sea freight from China to the UK: FCL or LCL &mdash; which is cheaper?</h2>
<p>Sea freight is the lowest-cost way to move volume from China into the UK, and
you choose between two options. FCL (Full Container Load) means you book a whole
container &mdash; a 20ft holds roughly 28 cubic metres and a 40ft around 58. LCL
(Less than Container Load) means your goods share a container and you pay only for
the space you occupy.</p>
<h3>Choose LCL when</h3>
<p>Your shipment is under roughly 15 cubic metres. Below that, sharing a container
usually costs less than paying for a whole one.</p>
<h3>Choose FCL when</h3>
<p>You are above roughly 15 cubic metres, your goods are fragile or high-value
(fewer handling points), or you want faster clearance &mdash; FCL is not held up
waiting for other importers' paperwork, the most common cause of LCL delay. See
the full <a href="https://www.carrgo.co.uk/services/sea-freight/">sea freight</a> and
<a href="https://www.carrgo.co.uk/services/container-shipping/">container shipping</a> pages.</p>

<h2>How does chargeable weight work on air freight from China to the UK?</h2>
<p>Air freight is the fastest option and is priced on chargeable weight, the
greater of actual weight and volumetric weight. Volumetric weight is length x
width x height in centimetres divided by 6000, so a large, light carton can cost
more than its physical weight suggests. Air suits urgent, high-value or small
shipments where the time saving is worth the higher cost. See
<a href="https://www.carrgo.co.uk/services/air-freight/">air freight</a>.</p>

<h2>When should you choose rail freight from China to the UK?</h2>
<p>Rail sits between sea and air: faster than sea at <strong>14-22 days</strong>,
and lower cost per unit than air. Containers travel from China through Central
Asia and Europe before final delivery to the UK. It fits goods that need to beat a
sea transit but do not justify air freight. See
<a href="https://www.carrgo.co.uk/services/rail-freight-china-uk/">rail freight from China to the UK</a>.</p>

<h2>What does the landed cost of importing from China actually include?</h2>
<p>The landed cost is everything you pay to get goods from the Chinese factory to
your UK door, not just the freight quote. It includes the freight charge, port or
airport handling, customs clearance, import duty, 20% import VAT, and final UK
delivery. A quote that shows only the freight rate understates the real cost, so
always compare on the all-in number. Model yours with the
<a href="https://www.carrgo.co.uk/tools/cost-calculator/">freight cost calculator</a>;
every quote we issue is all-inclusive.</p>

<h2>How do import duty, VAT and PVA work on China shipments?</h2>
<p>Almost every commercial shipment from China attracts import duty and 20% import
VAT. Duty is set by the commodity code of your goods; VAT is charged on the value
of the goods plus duty plus freight. With Postponed VAT Accounting (PVA), a
VAT-registered UK importer accounts for import VAT on their VAT return instead of
paying at the border, protecting cash flow. See the
<a href="https://www.carrgo.co.uk/guides/customs-clearance/">customs clearance guide</a>
and the <a href="https://www.carrgo.co.uk/resources/post-brexit-customs-guide/">post-Brexit customs guide</a>.</p>

<h2>Which UK port should your China shipment arrive at?</h2>
<p>The main deep-sea container ports for China-UK traffic are
<a href="https://www.carrgo.co.uk/ports/felixstowe/">Felixstowe</a>,
<a href="https://www.carrgo.co.uk/ports/london-gateway/">London Gateway</a>,
<a href="https://www.carrgo.co.uk/ports/southampton/">Southampton</a> and
<a href="https://www.carrgo.co.uk/ports/liverpool/">Liverpool</a>. The closest port
is not always the fastest &mdash; congestion changes week to week and a less busy
port can clear your container days sooner. Check the live
<a href="https://www.carrgo.co.uk/resources/port-congestion-tracker/">port congestion tracker</a>,
compare two options with the
<a href="https://www.carrgo.co.uk/tools/port-comparison/">port comparison tool</a>, or
read the weekly
<a href="https://www.carrgo.co.uk/resources/uk-port-congestion-report/">UK port congestion report</a>.</p>

<h2>What documents do you need to import from China?</h2>
<p>You need a commercial invoice, a packing list, and a transport document (bill of
lading for sea, air waybill for air). On the UK side you need a GB EORI number and
the correct commodity codes for your goods so duty and VAT are declared accurately.
A wrong commodity code is the most common cause of delay and overpayment. Carrgo
handles the declaration as part of
<a href="https://www.carrgo.co.uk/services/customs-clearance/">customs clearance</a>.</p>

<h2>Door-to-door vs port-to-port from China &mdash; which should you choose?</h2>
<p>Port-to-port covers the ocean leg and ends when your container is unloaded at a
UK port. Door-to-door includes collection in China, the ocean or air leg, UK
customs clearance, port handling and final
<a href="https://www.carrgo.co.uk/services/road-freight/">road freight</a> delivery.
If you are importing for the first time, or want one point of contact and one
all-in price, choose
<a href="https://www.carrgo.co.uk/services/door-to-door/">door-to-door</a>.</p>

<h2>How do you ship to Amazon FBA or an ecommerce warehouse from China?</h2>
<p>FBA sellers need more than a freight booking: carton labels, appointment
scheduling to the fulfilment centre, and clearance that meets Amazon's
requirements. We handle the full flow, from sea or air into the UK through to FBA
delivery, including <a href="https://www.carrgo.co.uk/services/warehousing/">warehousing</a>
if you need a buffer. See
<a href="https://www.carrgo.co.uk/services/amazon-fba-freight/">Amazon FBA freight</a>
and how we serve <a href="https://www.carrgo.co.uk/industries/ecommerce/">ecommerce</a>.</p>

<h2>How do you get an accurate China-to-UK shipping quote?</h2>
<p>The only accurate way to price a China-to-UK shipment is from your actual cargo:
origin and destination, volume or weight, commodity, and the service level you need
(port-to-port or door-to-door). Provide those details and we return an
all-inclusive quote within two hours, with customs, duty and VAT guidance included
and no obligation. <a href="https://www.carrgo.co.uk/get-a-quote/">Get your free quote</a>
or <a href="https://www.carrgo.co.uk/contact/">contact us</a>.</p>
