name: regression
on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Carrgo SaaS regression suite
        run: node tests/regression.js
